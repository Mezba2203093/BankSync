<!DOCTYPE html>
<html>
<head>
    <title>BankSync</title>
    <style>
        body { font-family: Arial; max-width: 900px; margin: 50px auto; padding: 20px; }
        h1 { color: #2c3e50; }
        .menu { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-top: 30px; }
        .menu a { 
            display: block; 
            padding: 15px; 
            background: #3498db; 
            color: white; 
            text-decoration: none; 
            border-radius: 5px;
            text-align: center;
        }
        .menu a:hover { background: #2980b9; }
        .menu a.special { background: #e67e22; }
        .menu a.special:hover { background: #d35400; }
        .menu a.history { background: #27ae60; }
        .menu a.history:hover { background: #1e8449; }
    </style>
</head>
<body>
    <h1>🏦 BankSync</h1>
    <p>Welcome to BankSync - Smart Banking Transaction Management System</p>
    
    <div class="menu">
        <a href="/create_account">📝 Create Account</a>
        <a href="/deposit">💰 Deposit</a>
        <a href="/withdraw">💳 Withdraw</a>
        <a href="/balance">📊 Check Balance</a>
        <a href="/transfer" class="special">💸 Transfer Money</a>
        <a href="/history" class="history">📜 Transaction History</a>
        <a href="/dashboard" style="background: #8e44ad; color: white;">📈 Analytics Dashboard</a>
    </div>
</body>
</html>
